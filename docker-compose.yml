version: "3.8"
services:
  neo4j:
    image: neo4j:5
    container_name: benchmark_neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_server_memory_heap_initial__size=100m
      - NEO4J_server_memory_heap_max__size=100m
      - NEO4J_server_memory_pagecache_size=50m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  memgraph:
    image: memgraph/memgraph:latest
    container_name: benchmark_memgraph
    ports:
      - "7688:7687"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  arangodb:
    image: arangodb:latest
    container_name: benchmark_arangodb
    ports:
      - "8529:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=${ARANGO_PASSWORD:-password}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  falkordb:
    image: falkordb/falkordb:latest
    container_name: benchmark_falkordb
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
